# Builds the Linux release on Ubuntu 22.04, so the binaries only need glibc
# 2.35 and the libstdc++ of GCC 12. Pushing a tag vX.Y.Z publishes a GitHub
# release; a manual run only uploads the package as a workflow artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-12 ninja-build pkg-config \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxext-dev libxrender-dev libxcomposite-dev libxi-dev
          cmake --version

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^project(VocalTuneBtw VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but CMakeLists.txt says $version"; exit 1; }

      - name: Build
        env:
          CC: gcc-12
          CXX: g++-12
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPITCHPILOT_BUILD_CLAP=OFF
          cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          scripts/package-linux.sh build
          so=dist/*/VocalTuneBtw.vst3/Contents/x86_64-linux/VocalTuneBtw.so
          echo "Newest glibc symbol: $(objdump -T $so | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VocalTuneBtw-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --title "VocalTuneBtw ${GITHUB_REF_NAME#v}" --notes-file "$notes"
